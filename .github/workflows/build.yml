name: Build Flutter Apps (Android APK & Linux AppImage)

on:
  push:
    branches:
      - main
    paths:
      - 'flutter/**'
      - '.github/**'
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
    paths:
      - 'flutter/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 1.0.0, defaults to pubspec.yaml version)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android Platform & Configure SDK
        run: |
          cd flutter
          # Backup existing custom AndroidManifest with BLE permissions
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          
          # Scaffold full Android project files
          flutter create --platforms=android --org bpt.studiohq .
          
          # Restore custom AndroidManifest.xml
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          
          cd ..
          python3 .github/scripts/configure_android.py

      - name: Build Android Release APK
        run: |
          cd flutter
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/open-dizo-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-dizo-android-apk
          path: dist/open-dizo-android.apk

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libblkid-dev \
            libsecret-1-dev \
            wget \
            file

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Linux Platform & Build Binary
        run: |
          cd flutter
          flutter create --platforms=linux --org bpt.studiohq .
          flutter pub get
          flutter build linux --release

      - name: Package Linux AppImage
        run: |
          cd flutter
          APP_DIR="AppDir"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/usr/bin"
          mkdir -p "$APP_DIR/usr/lib"
          mkdir -p "$APP_DIR/usr/share/icons/hicolor/256x256/apps"

          # Copy Flutter Linux release bundle
          cp -r build/linux/x64/release/bundle/* "$APP_DIR/"

          # Create desktop entry
          cat << 'EOF' > "$APP_DIR/open_dizo.desktop"
          [Desktop Entry]
          Name=Open Dizo
          Comment=Open-source BLE companion & dial studio for DIZO Watch D
          Exec=open_dizo
          Icon=open_dizo
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          # Create desktop icon
          if [ -f "../wallpapers/dizo_wallpaper_240x286.png" ]; then
            cp "../wallpapers/dizo_wallpaper_240x286.png" "$APP_DIR/open_dizo.png"
            cp "../wallpapers/dizo_wallpaper_240x286.png" "$APP_DIR/.DirIcon"
            cp "../wallpapers/dizo_wallpaper_240x286.png" "$APP_DIR/usr/share/icons/hicolor/256x256/apps/open_dizo.png"
          fi

          # Create AppRun launcher
          cat << 'EOF' > "$APP_DIR/AppRun"
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}:${HERE}/usr/bin/:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/lib:${HERE}/usr/lib/:${LD_LIBRARY_PATH}"
          exec "${HERE}/open_dizo" "$@"
          EOF
          chmod +x "$APP_DIR/AppRun"

          # Download and run appimagetool without FUSE
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract

          mkdir -p ../dist
          ARCH=x86_64 ./squashfs-root/AppRun "$APP_DIR" ../dist/OpenDizo-x86_64.AppImage
          chmod +x ../dist/OpenDizo-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-dizo-linux-appimage
          path: dist/OpenDizo-x86_64.AppImage

  release:
    name: Publish GitHub Release Assets
    needs: [build-android, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: open-dizo-android-apk
          path: release_assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: open-dizo-linux-appimage
          path: release_assets

      - name: Prepare Versioned Release Assets & Checksums
        id: prep
        run: python3 .github/scripts/prepare_release_assets.py
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Open Dizo v${{ steps.prep.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            final_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
