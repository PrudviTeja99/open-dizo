name: open_dizo
description: Open Dizo - Companion app and custom watch face studio for DIZO Watch D.
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.5
  permission_handler: ^11.3.1
  mobile_scanner: ^6.0.4
  intl: ^0.19.0
  image: ^4.3.0
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ota.bin
